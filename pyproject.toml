[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cockatiel-desktop-pet"
version = "1.1.0"
description = "A quiet, local-only cockatiel living behind Windows desktop icons"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8.3,<6.9"]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7", "Pillow>=11,<13"]

[project.gui-scripts]
cockatiel-pet = "cockatiel_pet.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cockatiel_pet = ["assets/*.png", "assets/*.json", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

